<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Figma Report Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      h2 {
        margin-top: 0;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        padding: 10px 16px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f5f5f5;
        font-size: 13px;
      }

      button:hover:not(:disabled) {
        background: #e0e0e0;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      textarea {
        width: 100%;
        height: 380px;
        margin-top: 15px;
        font-family: monospace;
        font-size: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px;
        resize: vertical;
      }

      #status {
        margin-top: 12px;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: bold;
        min-height: 28px;
      }

      #status.idle {
        background: transparent;
        color: #555;
      }

      #status.success {
        background: #e6f4ea;
        color: #1e7e34;
      }

      #status.error {
        background: #fdecea;
        color: #b71c1c;
      }

      #status.info {
        background: #e8f0fe;
        color: #1a55cc;
      }
    </style>
  </head>

  <body>
    <h2>Figma Report Generator</h2>

    <p>
      Select a frame in Figma and extract its design data.
    </p>

    <div class="button-row">
      <button id="extract">Extract Design</button>
      <button id="copy">Copy JSON</button>
      <button id="save" disabled>Save to Database</button>
      <button id="cancel">Cancel</button>
    </div>

    <div id="status" class="idle"></div>

    <textarea
      id="output"
      placeholder="JSON data will appear here..."
      readonly
    ></textarea>

    <script>
      const extractButton = document.getElementById("extract");
      const copyButton = document.getElementById("copy");
      const saveButton = document.getElementById("save");
      const cancelButton = document.getElementById("cancel");

      const output = document.getElementById("output");
      const status = document.getElementById("status");


      // ---------------------------------------------------------
      // STATUS
      // ---------------------------------------------------------

      function setStatus(text, type = "idle") {
        status.textContent = text;
        status.className = type;
      }


      // ---------------------------------------------------------
      // EXTRACT DESIGN
      // ---------------------------------------------------------

      extractButton.onclick = () => {

        setStatus(
          "Extracting design...",
          "info"
        );

        extractButton.disabled = true;
        saveButton.disabled = true;

        output.value = "";

        parent.postMessage(
          {
            pluginMessage: {
              type: "extract-design"
            }
          },
          "*"
        );
      };


      // ---------------------------------------------------------
      // SAVE DESIGN
      // ---------------------------------------------------------

      saveButton.onclick = () => {

        setStatus(
          "Sending design to backend...",
          "info"
        );

        saveButton.disabled = true;

        parent.postMessage(
          {
            pluginMessage: {
              type: "save-design"
            }
          },
          "*"
        );
      };


      // ---------------------------------------------------------
      // COPY JSON
      // ---------------------------------------------------------

      copyButton.onclick = async () => {

        if (!output.value) {

          setStatus(
            "Nothing to copy. Extract a design first.",
            "error"
          );

          return;
        }

        try {

          await navigator.clipboard.writeText(
            output.value
          );

          setStatus(
            "JSON copied to clipboard!",
            "success"
          );

        } catch (err) {

          setStatus(
            "Copy failed: " +
              (err instanceof Error
                ? err.message
                : String(err)),
            "error"
          );
        }
      };


      // ---------------------------------------------------------
      // CANCEL
      // ---------------------------------------------------------

      cancelButton.onclick = () => {

        parent.postMessage(
          {
            pluginMessage: {
              type: "cancel"
            }
          },
          "*"
        );
      };


      // ---------------------------------------------------------
      // MESSAGES FROM CODE.TS
      // ---------------------------------------------------------

      window.onmessage = async (event) => {

        const message =
          event.data.pluginMessage;

        if (!message) {
          return;
        }


        // -------------------------------------------------------
        // DESIGN EXTRACTED
        // -------------------------------------------------------

        if (message.type === "design-data") {

          output.value =
            JSON.stringify(
              message.data,
              null,
              2
            );

          setStatus(
            "Design extracted successfully!",
            "success"
          );

          extractButton.disabled = false;
          saveButton.disabled = false;
        }


        // -------------------------------------------------------
        // SEND DESIGN TO FASTAPI
        // -------------------------------------------------------

        if (message.type === "perform-save") {

          setStatus(
            "Saving design to database...",
            "info"
          );

          try {

            const response = await fetch(
              message.url,
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                  "apikey": message.apikey,
                  "Authorization": "Bearer " + message.apikey,
                  "Prefer": "return=minimal"
                },

                body: JSON.stringify(
                  message.body
                )
              }
            );


            const result =
              response.ok
                ? null
                : await response.json();


            if (!response.ok) {

              setStatus(
                "Save failed: " +
                  JSON.stringify(result),
                "error"
              );

            } else {

              setStatus(
                "Design saved successfully!",
                "success"
              );
            }

          } catch (err) {

            setStatus(
              "Backend connection failed: " +
                (err instanceof Error
                  ? err.message
                  : String(err)),
              "error"
            );
          }


          saveButton.disabled = false;
        }


        // -------------------------------------------------------
        // SAVE SUCCESS
        // -------------------------------------------------------

        if (message.type === "save-success") {

          setStatus(
            "Design saved successfully!",
            "success"
          );

          saveButton.disabled = false;
        }


        // -------------------------------------------------------
        // SAVE ERROR
        // -------------------------------------------------------

        if (message.type === "save-error") {

          setStatus(
            "Save failed: " +
              message.message,
            "error"
          );

          saveButton.disabled = false;
        }


        // -------------------------------------------------------
        // GENERAL ERROR
        // -------------------------------------------------------

        if (message.type === "error") {

          setStatus(
            "Error: " +
              message.message,
            "error"
          );

          extractButton.disabled = false;
          saveButton.disabled = true;
        }
      };
    </script>
  </body>
</html>
