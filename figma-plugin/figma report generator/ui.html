<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>Figma Report Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      h2 {
        margin-top: 0;
      }

      button {
        padding: 10px 16px;
        margin-right: 8px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      textarea {
        width: 100%;
        height: 400px;
        margin-top: 15px;
        font-family: monospace;
        font-size: 12px;
      }

      #status {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h2>Figma Report Generator</h2>

    <p>Select a frame in Figma and extract its design data.</p>

    <button id="extract">Extract Design</button>

    <button id="copy">Copy JSON</button>

    <button id="save" disabled>Save to Database</button>

    <button id="cancel">Cancel</button>

    <div id="status"></div>

    <textarea
      id="output"
      placeholder="JSON data will appear here..."
      readonly
    ></textarea>

    <script>
      const extractButton = document.getElementById("extract");

      const copyButton = document.getElementById("copy");

      const saveButton = document.getElementById("save");

      const cancelButton = document.getElementById("cancel");

      const output = document.getElementById("output");

      const status = document.getElementById("status");

      // Extract button
      extractButton.onclick = () => {
        status.textContent = "Extracting design...";

        saveButton.disabled = true;

        parent.postMessage(
          {
            pluginMessage: {
              type: "extract-design",
            },
          },
          "*",
        );
      };

      // Save to Database button
      saveButton.onclick = () => {
        status.textContent = "Saving to database...";

        saveButton.disabled = true;

        parent.postMessage(
          {
            pluginMessage: {
              type: "save-design",
            },
          },
          "*",
        );
      };

      // Copy JSON
      copyButton.onclick = async () => {
        if (!output.value) {
          return;
        }

        await navigator.clipboard.writeText(output.value);

        status.textContent = "JSON copied!";
      };

      // Cancel
      cancelButton.onclick = () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: "cancel",
            },
          },
          "*",
        );
      };

      // Receive message from code.js
      window.onmessage = async (event) => {
        const message = event.data.pluginMessage;

        if (!message) {
          return;
        }

        // JSON received
        if (message.type === "design-data") {
          output.value = JSON.stringify(message.data, null, 2);

          status.textContent = "Design extracted successfully!";

          saveButton.disabled = false;
        }

        // Perform the Supabase POST from the UI iframe (full browser fetch)
        if (message.type === "perform-save") {
          console.log("[v2] perform-save received, fetching from UI iframe:", message.url);
          status.textContent = "Saving to database (UI fetch)...";
          try {
            const response = await fetch(message.url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": message.apikey,
                "Authorization": "Bearer " + message.apikey,
                "Prefer": "return=minimal",
              },
              body: JSON.stringify(message.body),
            });

            if (!response.ok) {
              const errorText = await response.text();
              status.textContent = "Database error: HTTP " + response.status + ": " + errorText;
            } else {
              status.textContent = "Design saved to database!";
            }
          } catch (err) {
            status.textContent = "Database error: " + (err instanceof Error ? err.message : String(err));
          }

          saveButton.disabled = false;
        }

        // Save success (kept for any future direct code.ts success path)
        if (message.type === "save-success") {
          status.textContent = "Design saved to database!";

          saveButton.disabled = false;
        }

        // Save error from code.ts (e.g. no design data guard)
        if (message.type === "save-error") {
          status.textContent = "Database error: " + message.message;

          saveButton.disabled = false;
        }

        // Error received
        if (message.type === "error") {
          status.textContent = "Error: " + message.message;
        }
      };
    </script>
  </body>
</html>
